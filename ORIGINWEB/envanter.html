<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envanterim | ORIGIN CARDS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="envanter.css">
</head>

<body class="main-page">

    <nav class="elite-nav">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer">ORIGIN <span>CARDS</span></div>
        <div class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="market.html">Pazar Yeri</a>
            <div id="user-profile" class="user-profile-dropdown">
                <div class="profile-trigger">
                    <span id="user-initial">?</span>
                    <div class="online-indicator"></div>
                </div>
                <div class="dropdown-menu">
                    <div class="dropdown-header">
                        <p id="user-email-display">Yükleniyor...</p>
                        <span>Koleksiyoncu</span>
                    </div>
                    <hr>
                    <a href="#" id="logout-btn" class="logout-link">Güvenli Çıkış</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="content-wrapper">
        <header class="inventory-header">
            <div class="elite-badge">KOLEKSİYONUN</div>
            <h1>VARLIKLARIM</h1>
            <p id="card-count">Toplam 0 nadir kart bulundu.</p>
        </header>

        <div id="inventory-grid" class="card-container">
            <div class="loading-spinner">Kartlar yükleniyor...</div>
        </div>
    </main>

    <script type="module" src="inventory.js"></script>
</body>
</html>
